name: Map-Resetter
description: $description
version: '${version}'

main: me.lumen.mapResetter.MapResetter
api-version: '1.21'
permissions:
  mapresetter.mapsave:
    default: op
    description: Allows the usage of the main mapsave command
  mapresetter.save:
    default: op
    description: Allows saving a map save with /mapsave save <name> <world>
    children:
      - mapresetter.command
  mapresetter.list:
    default: op
    description: Allows to list map saves with /mapsave list
    children:
      - mapresetter.command
  mapresetter.update:
    default: op
    description: Allows to update a map save with /mapsave update <save>
    children:
      - mapresetter.command
  mapresetter.delete:
    default: op
    description: Allows to delete a map save with /mapsave delete <save>
    children:
      - mapresetter.command
  mapresetter.reset:
    default: op
    description: Allows resetting a map save with /mapsave reset <save>
    children:
      - mapresetter.command
  mapresetter.mapresettercommand:
    default: op
    description: Use /mapresetter
  mapresetter.info:
    default: op
    description: Print plugin info with /mapresetter info
    children:
      - mapresetter.mapresettercommand
  mapresetter.version:
    default: op
    description: Print the plugin version with /mapresetter version
    children:
      - mapresetter.mapresettercommand
  mapresetter.reload:
    default: op
    description: Allows reloading the messages.yml, config.yml, and mapsave files with /mapresetter reload
    children:
      - mapresetter.mapresettercommand
  mapresetter.set_debug:
    default: op
    description: Allows players to set whether debug logs for skipping file copying is enabled
    children:
      - mapresetter.mapresettercommand
commands:
  mapsave:
    description: Manage your map saves
    permission: mapresetter.mapsave
authors: [Lumen-Fire]
